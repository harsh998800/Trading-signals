
<!DOCTYPE html>
<html>
<head>
<title>Trading Signals Pro</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
 margin:0;
 font-family:Arial;
 background:#050505;
 color:white;
}

nav{
 background:#0b0f0d;
 padding:15px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid #16a34a;
}

.logo{
 color:#22c55e;
 font-size:24px;
 font-weight:bold;
}

button{
 background:#22c55e;
 border:none;
 padding:10px 18px;
 border-radius:8px;
 font-weight:bold;
}

.container{
 padding:20px;
}

.card{
 background:#111;
 margin:15px 0;
 padding:20px;
 border-radius:15px;
 border:1px solid #222;
 box-shadow:0 0 15px #064e3b;
}

.buy{
 color:#22c55e;
 font-size:25px;
 font-weight:bold;
}

.sell{
 color:#ef4444;
 font-size:25px;
 font-weight:bold;
}

.tag{
 background:#14532d;
 padding:5px 10px;
 border-radius:20px;
}
</style>

</head>

<body>

<nav>
<div class="logo">📈 Trade Signals</div>
<button>Login</button>
</nav>


<div class="container">

<h1>Live Signals Dashboard</h1>


<div class="card">
<span class="tag">NIFTY</span>

<h2 class="buy">BUY CALL</h2>

<p>Entry: 22000</p>
<p>Target: 22100</p>
<p>Stop Loss: 21950</p>

</div>



<div class="card">

<span class="tag">BANKNIFTY</span>

<h2 class="sell">SELL PUT</h2>

<p>Entry: 51000</p>
<p>Target: 50800</p>
<p>Stop Loss: 51100</p>

</div>


</div>

</body>
</html>
