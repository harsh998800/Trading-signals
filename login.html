<!DOCTYPE html>
<html>
<head>
<title>Login - Trade Signals</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
 background:#050505;
 color:white;
 font-family:Arial;
 display:flex;
 justify-content:center;
 align-items:center;
 height:100vh;
}

.box{
 background:#111;
 padding:30px;
 border-radius:15px;
 width:300px;
 text-align:center;
 border:1px solid #22c55e;
}

input{
 width:90%;
 padding:12px;
 margin:10px;
 border-radius:8px;
 border:none;
}

button{
 background:#22c55e;
 border:none;
 padding:12px 25px;
 border-radius:8px;
 font-weight:bold;
}

a{
 color:#22c55e;
}
</style>

</head>

<body>

<div class="box">

<h1>🔐 Login</h1>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button>Login</button>

<p>
New user? <a href="signup.html">Signup</a>
</p>

</div>

</body>
</html>
