<!DOCTYPE html>
<html>
<head>
<title>Admin Panel - Trade Signals</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
background:#050505;
color:white;
font-family:Arial;
padding:20px;
}

.box{
background:#111;
padding:25px;
border-radius:15px;
border:1px solid #22c55e;
max-width:400px;
margin:auto;
}

input,select{
width:90%;
padding:12px;
margin:10px;
border-radius:8px;
border:none;
}

button{
background:#22c55e;
border:none;
padding:12px 25px;
border-radius:8px;
font-weight:bold;
}
</style>

</head>

<body>

<div class="box">

<h1>👑 Admin Panel</h1>

<input id="stock" placeholder="Stock Name">

<select id="type">
<option>BUY</option>
<option>SELL</option>
</select>

<input id="entry" placeholder="Entry Price">

<input id="target" placeholder="Target">

<input id="sl" placeholder="Stop Loss">

<button id="add">Add Signal</button>

<p id="msg"></p>

</div>


<script>

document.getElementById("add").onclick=function(){

let stock=document.getElementById("stock").value;
let type=document.getElementById("type").value;
let entry=document.getElementById("entry").value;
let target=document.getElementById("target").value;
let sl=document.getElementById("sl").value;


localStorage.setItem("signal",
JSON.stringify({
stock,type,entry,target,sl
})
);


document.getElementById("msg").innerHTML="✅ Signal Added";

}

</script>

</body>
</html>
